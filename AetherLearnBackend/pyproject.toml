[project]
name = "aetherlearn-backend"
version = "1.0.0"
description = "AetherLearn Python microservices backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1.0",
  "asgi-lifespan>=2.1.0",
  "boto3>=1.34.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "minio>=7.2.0",
  "nats-py>=2.7.0",
  "offline-sqlite",
  "orjson>=3.10.0",
  "pillow>=10.4.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "pyjwt>=2.9.0",
  "pymongo>=4.11.0",
  "python-multipart>=0.0.9",
  "redis>=5.0.0",
  "reportlab>=4.2.0",
  "structlog>=24.4.0",
  "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
  "mypy>=1.11.0",
  "pre-commit>=3.8.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "testcontainers>=4.8.0",
]

[tool.uv.workspace]
members = [
  "apps/api_gateway",
  "apps/auth_service",
  "apps/school_service",
  "apps/lesson_service",
  "apps/ai_service",
  "apps/assignment_service",
  "apps/commons_service",
  "apps/review_service",
  "apps/sync_service",
  "apps/export_service",
  "apps/notification_service",
  "apps/storage_service",
  "apps/worker",
  "packages/*",
]

[tool.uv]
package = false

[tool.uv.sources]
api-client = { workspace = true }
offline-sqlite = { workspace = true }
service-auth = { workspace = true }
shared-events = { workspace = true }
shared-schemas = { workspace = true }
shared-utils = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "apps"]
pythonpath = [
  ".",
  "packages/shared_schemas",
  "packages/shared_events",
  "packages/shared_utils",
  "packages/service_auth",
  "packages/api_client",
  "packages/offline_sqlite",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["E501", "S101", "S104", "S105", "S106", "B008", "UP046"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"**/__init__.py" = ["F401"]
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = false
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
explicit_package_bases = true
mypy_path = [
  "packages/shared_schemas",
  "packages/shared_events",
  "packages/shared_utils",
  "packages/service_auth",
  "packages/api_client",
  "packages/offline_sqlite",
]
disable_error_code = [
  "attr-defined",
  "import-not-found",
  "import-untyped",
  "no-any-return",
  "no-untyped-call",
  "no-untyped-def",
  "type-arg",
  "arg-type",
]
exclude = ["uv.lock", ".venv", "__pycache__"]

[tool.coverage.run]
branch = true
source = ["apps", "packages"]
