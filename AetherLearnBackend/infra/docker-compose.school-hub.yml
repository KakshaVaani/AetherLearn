include:
  - docker-compose.yml

services:
  api-gateway:
    environment:
      SCHOOL_HUB_MODE: "true"
      AI_RUNTIME: local-hub
      USE_MOCK: "false"
      ALLOW_RUNTIME_FALLBACK: "false"
      OLLAMA_MODEL: gemma4:e4b
      ENFORCE_GEMMA_MODEL: "true"
      REQUIRED_GEMMA_MODEL: gemma4:e4b
      OLLAMA_BASE_URL: http://ollama:11434

  ai-service:
    environment:
      SCHOOL_HUB_MODE: "true"
      AI_RUNTIME: local-hub
      USE_MOCK: "false"
      ALLOW_RUNTIME_FALLBACK: "false"
      OLLAMA_MODEL: gemma4:e4b
      ENFORCE_GEMMA_MODEL: "true"
      REQUIRED_GEMMA_MODEL: gemma4:e4b
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on: [ollama]

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes:
      - ollama-data:/root/.ollama

volumes:
  ollama-data:
