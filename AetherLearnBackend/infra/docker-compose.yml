services:
  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
    volumes:
      - mongo-data:/data/db
      - ./mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  nats:
    image: nats:2.10-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    ports: ["4222:4222", "8222:8222"]
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio-data:/data

  api-gateway:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.gateway
    command: /app/.venv/bin/uvicorn apps.api_gateway.app.main:app --host 0.0.0.0 --port 8000
    env_file: ../.env.example
    environment: &service-env
      MONGODB_URI: mongodb://mongodb:27017
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      AUTH_SERVICE_URL: http://auth-service:8001
      SCHOOL_SERVICE_URL: http://school-service:8002
      LESSON_SERVICE_URL: http://lesson-service:8003
      AI_SERVICE_URL: http://ai-service:8004
      ASSIGNMENT_SERVICE_URL: http://assignment-service:8005
      COMMONS_SERVICE_URL: http://commons-service:8006
      REVIEW_SERVICE_URL: http://review-service:8007
      SYNC_SERVICE_URL: http://sync-service:8008
      EXPORT_SERVICE_URL: http://export-service:8009
      NOTIFICATION_SERVICE_URL: http://notification-service:8010
      STORAGE_SERVICE_URL: http://storage-service:8011
      USE_MOCK: "false"
      AI_RUNTIME: ollama
      ALLOW_RUNTIME_FALLBACK: "false"
      OLLAMA_MODEL: gemma4:e4b
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      ENFORCE_GEMMA_MODEL: "true"
      REQUIRED_GEMMA_MODEL: gemma4:e4b
    ports: ["8000:8000"]
    depends_on: [auth-service, school-service, lesson-service, ai-service, assignment-service]

  auth-service:
    build: { context: .., dockerfile: infra/docker/Dockerfile.service }
    command: /app/.venv/bin/uvicorn apps.auth_service.app.main:app --host 0.0.0.0 --port 8001
    env_file: ../.env.example
    environment: *service-env
    ports: ["8001:8001"]
    depends_on: [mongodb, nats, redis]

  school-service:
    build: { context: .., dockerfile: infra/docker/Dockerfile.service }
    command: /app/.venv/bin/uvicorn apps.school_service.app.main:app --host 0.0.0.0 --port 8002
    env_file: ../.env.example
    environment: *service-env
    ports: ["8002:8002"]
    depends_on: [mongodb, nats]

  lesson-service:
    build: { context: .., dockerfile: infra/docker/Dockerfile.service }
    command: /app/.venv/bin/uvicorn apps.lesson_service.app.main:app --host 0.0.0.0 --port 8003
    env_file: ../.env.example
    environment: *service-env
    ports: ["8003:8003"]
    depends_on: [mongodb, nats]

  ai-service:
    build: { context: .., dockerfile: infra/docker/Dockerfile.service }
    command: /app/.venv/bin/uvicorn apps.ai_service.app.main:app --host 0.0.0.0 --port 8004
    env_file: ../.env.example
    environment: *service-env
    ports: ["8004:8004"]
    depends_on: [mongodb, nats]

  assignment-service:
    build: { context: .., dockerfile: infra/docker/Dockerfile.service }
    command: /app/.venv/bin/uvicorn apps.assignment_service.app.main:app --host 0.0.0.0 --port 8005
    env_file: ../.env.example
    environment: *service-env
    ports: ["8005:8005"]
    depends_on: [mongodb, nats]

  commons-service:
    build: { context: .., dockerfile: infra/docker/Dockerfile.service }
    command: /app/.venv/bin/uvicorn apps.commons_service.app.main:app --host 0.0.0.0 --port 8006
    env_file: ../.env.example
    environment: *service-env
    ports: ["8006:8006"]
    depends_on: [mongodb, nats]

  review-service:
    build: { context: .., dockerfile: infra/docker/Dockerfile.service }
    command: /app/.venv/bin/uvicorn apps.review_service.app.main:app --host 0.0.0.0 --port 8007
    env_file: ../.env.example
    environment: *service-env
    ports: ["8007:8007"]
    depends_on: [mongodb, nats]

  sync-service:
    build: { context: .., dockerfile: infra/docker/Dockerfile.service }
    command: /app/.venv/bin/uvicorn apps.sync_service.app.main:app --host 0.0.0.0 --port 8008
    env_file: ../.env.example
    environment: *service-env
    ports: ["8008:8008"]
    depends_on: [mongodb, nats]

  export-service:
    build: { context: .., dockerfile: infra/docker/Dockerfile.service }
    command: /app/.venv/bin/uvicorn apps.export_service.app.main:app --host 0.0.0.0 --port 8009
    env_file: ../.env.example
    environment: *service-env
    ports: ["8009:8009"]
    depends_on: [mongodb, nats]

  notification-service:
    build: { context: .., dockerfile: infra/docker/Dockerfile.service }
    command: /app/.venv/bin/uvicorn apps.notification_service.app.main:app --host 0.0.0.0 --port 8010
    env_file: ../.env.example
    environment: *service-env
    ports: ["8010:8010"]
    depends_on: [mongodb, nats]

  storage-service:
    build: { context: .., dockerfile: infra/docker/Dockerfile.service }
    command: /app/.venv/bin/uvicorn apps.storage_service.app.main:app --host 0.0.0.0 --port 8011
    env_file: ../.env.example
    environment: *service-env
    ports: ["8011:8011"]
    depends_on: [mongodb, minio]

  worker:
    build: { context: .., dockerfile: infra/docker/Dockerfile.worker }
    env_file: ../.env.example
    environment: *service-env
    depends_on: [mongodb, nats, redis]

volumes:
  mongo-data:
  nats-data:
  minio-data:
